# Cache by what was actually served, not by URL. HTML must always revalidate:
# a stale shell points at a stale bundle and shows a price we no longer charge.
map $sent_http_content_type $otrace_cache {
    default             "public, max-age=3600";
    ~*^text/html        "no-cache, must-revalidate";
    ~*^application/json "no-cache, must-revalidate";
    ~*^application/xml  "no-cache, must-revalidate";
    ~*^text/plain       "no-cache, must-revalidate";
    ~*^font/            "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # This container sits behind the TLS-terminating proxy, so it believes every
    # request is http. Relative Location headers keep the browser on https.
    absolute_redirect off;

    # Text assets compress ~70%: the app bundle goes from ~265KB to ~80KB.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/xml
               application/manifest+json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $otrace_cache always;
    index index.html;

    # Hashed filenames are immutable; everything else must revalidate so a price
    # change reaches a returning visitor on their next load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every real page is prerendered to <route>.html at build time
    # (site/scripts/prerender.mjs). Anything else is a genuine 404 with the
    # app's own not-found page, never a 200 soft-404 that search engines index.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
