services:
  db:
    image: mysql:8.0
    container_name: otrace-db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
      - --max-connections=64
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - otrace_db_data:/var/lib/mysql
    networks: [otrace-internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: nginx:alpine
    container_name: otrace-web
    restart: unless-stopped
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    networks: [scalaro-net]

  api:
    # Built from the repository ROOT so the image can carry shared/ and theme/
    # beside api/. api/catalog.js reads ../shared/product-media.json at import
    # time, so an api-only context stops the container booting at all.
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: otrace-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 3000
      SITE_URL: ${SITE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Email over HTTPS: the cPanel SMTP host is unreachable from this VPS.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SHOP_EMAIL: ${SHOP_EMAIL:-}
      KLAVIYO_PRIVATE_API_KEY: ${KLAVIYO_PRIVATE_API_KEY:-}
      KLAVIYO_LIST_ID: ${KLAVIYO_LIST_ID:-}
    networks: [otrace-internal, scalaro-net]

volumes:
  otrace_db_data:

networks:
  otrace-internal:
    driver: bridge
  scalaro-net:
    external: true
