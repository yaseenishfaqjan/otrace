# The otrace.co server block. The Kalles theme and the API serve the storefront.
#
# NOT loaded by itself. The live front end is the shared `scalaro-nginx-1`
# container reading /opt/scalaro/nginx.conf. Apply this file with
# `sh deploy/apply-nginx-routes.sh`. That script truncates the live file in
# place. Do not `sed -i` it: a single-file bind mount detaches when the inode
# changes, and the container keeps serving the old config.
#
# otrace-web (the React image) is not on the request path. Product photos,
# brand files, robots.txt, sitemap.xml, llms.txt, merchant-feed.xml, the
# journal, the legal pages and /order/success all come from otrace-api.
#
# Stop the React container only after the checks in deploy/stop-otrace-web.md
# return 200 from the theme. Until then it can stay running and unused.
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    server_name otrace.co;
    ssl_certificate     /etc/letsencrypt/live/otrace.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otrace.co/privkey.pem;
    client_max_body_size 15m;

    # Docker DNS, resolved per request: containers can be rebuilt and get a new
    # address without nginx holding the old one until it is restarted.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ^~ /api/ {
        set $otrace_api http://otrace-api:3000;
        proxy_pass $otrace_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── Theme HTML ──────────────────────────────────────────────────────────
    location = / {
        set $otrace_theme http://otrace-api:3000;
        proxy_pass $otrace_theme/api/theme-preview/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /shop {
        set $otrace_theme http://otrace-api:3000;
        rewrite ^/shop(.*)$ /api/theme-preview/shop$1 break;
        proxy_pass $otrace_theme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Slugs only. /product/oversized-hoodie.md is a discovery file, matched
    # by the markdown location below, because this is not a ^~ prefix.
    location ~ ^/product/[a-z0-9-]+/?$ {
        set $otrace_theme http://otrace-api:3000;
        rewrite ^/product/([a-z0-9-]+)/?$ /api/theme-preview/product/$1 break;
        proxy_pass $otrace_theme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ~ ^/(sizing|garment-dyed|lookbook|contact|privacy|terms|shipping|about)/?$ {
        set $otrace_theme http://otrace-api:3000;
        rewrite ^/([a-z-]+)/?$ /api/theme-preview/page/$1 break;
        proxy_pass $otrace_theme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /cart {
        set $otrace_theme http://otrace-api:3000;
        proxy_pass $otrace_theme/api/theme-preview/cart;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /blog {
        set $otrace_theme http://otrace-api:3000;
        proxy_pass $otrace_theme/api/theme-preview/blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ~ ^/blog/[a-z0-9-]+/?$ {
        set $otrace_theme http://otrace-api:3000;
        rewrite ^/blog/([a-z0-9-]+)/?$ /api/theme-preview/blog/$1 break;
        proxy_pass $otrace_theme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /order/success {
        set $otrace_theme http://otrace-api:3000;
        proxy_pass $otrace_theme/api/theme-preview/order/success;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /account {
        set $otrace_theme http://otrace-api:3000;
        proxy_pass $otrace_theme/api/theme-preview/account;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /account/ {
        set $otrace_theme http://otrace-api:3000;
        rewrite ^/account/(.*)$ /api/theme-preview/account/$1 break;
        proxy_pass $otrace_theme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Wishlist is /search/?view=wishlist. Other /search requests 302 to /shop
    # inside the API. Suggest is the predictive-search section the theme fetches.
    location ^~ /search/suggest {
        set $otrace_api http://otrace-api:3000;
        proxy_pass $otrace_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /search {
        set $otrace_api http://otrace-api:3000;
        proxy_pass $otrace_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Photos, brand files, SEO. Same path on the API. No React. ──────────
    location ^~ /products/ { set $otrace_api http://otrace-api:3000; proxy_pass $otrace_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /brand/    { set $otrace_api http://otrace-api:3000; proxy_pass $otrace_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /lookbook/ { set $otrace_api http://otrace-api:3000; proxy_pass $otrace_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /email/    { set $otrace_api http://otrace-api:3000; proxy_pass $otrace_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /turntable/ { set $otrace_api http://otrace-api:3000; proxy_pass $otrace_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /llms/     { set $otrace_api http://otrace-api:3000; proxy_pass $otrace_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }

    location ~ \.(md|txt|xml|json)$|^/(favicon|apple-touch-icon|icon-512|og\.|campaign\.|detail-|hero-) {
        set $otrace_api http://otrace-api:3000;
        proxy_pass $otrace_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/size-guide/?$ { return 302 /sizing; }

    # Anything still unknown goes to the theme home. It does not fall through
    # to otrace-web.
    location / { return 302 /; }
}
