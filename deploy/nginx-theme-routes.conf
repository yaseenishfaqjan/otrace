# The paths otrace.co serves from the Kalles theme.
#
# NOT loaded from this repo. The live front end is the shared `scalaro-nginx-1`
# container reading /opt/scalaro/nginx.conf, and nothing mounts this file - it
# is kept here so the change is in version control and reviewable, because a
# config that exists only on the server is a config nobody can diff.
#
# These blocks go INSIDE the `server { server_name otrace.co; }` block, replacing
# the whole otrace.co 443 server block.
#
# Editing /opt/scalaro/nginx.conf: never `sed -i` it. It is a single-file bind
# mount, and in-place editing replaces the inode and silently detaches the file
# from the container. Truncate-write it (`cat new > nginx.conf`), confirm the
# inode is unchanged, check `docker exec scalaro-nginx-1 nginx -t`, then
# `nginx -s reload`.
#
# ---------------------------------------------------------------------------
# 2026-10-27 cutover: the Kalles theme owns the storefront. otrace-web (React)
# no longer has a catch-all. It serves ONLY:
#   /order/*  /assets/*   Stripe success page and its bundle
#   /privacy /terms /shipping /blog*   not yet ported to the theme
#   sitemap.xml robots.txt llms.txt merchant-feed.xml favicon
#   static files by extension (product photos /products/*, /brand/*.svg, ...)
# /search* -> 302 /shop; every other unknown path -> 302 / (theme home).
# Below is the full live `server { server_name otrace.co; }` (443) block.
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/otrace.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otrace.co/privkey.pem;
    client_max_body_size 15m;

    # Docker DNS, resolved per request: containers can be rebuilt and get a new
    # address without nginx holding the old one until it is restarted.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ^~ so /api/theme-assets/*.css and /api/theme-preview/*.js are not taken
    # by the extension regex below, which would send them to the React build.
    location ^~ /api/ {
        set $otrace_api http://otrace-api:3000;
        proxy_pass $otrace_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── The Kalles theme serves the storefront ──────────────────────────────
    #
    # Only the paths listed here. Anything else still comes from the React
    # build below, so a page that is not ported yet keeps working rather than
    # 404ing - including /order/success, which Stripe sends customers to after
    # they pay, and the SEO files (sitemap.xml, llms.txt, merchant-feed.xml).
    #
    # To roll back, delete these four blocks and reload. Nothing else changes.
    location = / {
        set $otrace_theme http://otrace-api:3000;
        proxy_pass $otrace_theme/api/theme-preview/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /shop {
        set $otrace_theme http://otrace-api:3000;
        rewrite ^/shop(.*)$ /api/theme-preview/shop$1 break;
        proxy_pass $otrace_theme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /product/ {
        set $otrace_theme http://otrace-api:3000;
        rewrite ^/product/(.*)$ /api/theme-preview/product/$1 break;
        proxy_pass $otrace_theme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # The ported content pages. The theme's own header links to all four, so
    # these were 404s under the theme until now.
    location ~ ^/(sizing|garment-dyed|lookbook|contact)/?$ {
        set $otrace_theme http://otrace-api:3000;
        rewrite ^/([a-z-]+)/?$ /api/theme-preview/page/$1 break;
        proxy_pass $otrace_theme;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /cart {
        set $otrace_theme http://otrace-api:3000;
        proxy_pass $otrace_theme/api/theme-preview/cart;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Old React build: ONLY Stripe order success page, its assets, SEO files.
    location ~ (\.(jpe?g|png|webp|avif|gif|svg|ico|mp4|webm|woff2?|ttf|css|js|json|txt|xml|pdf)$)|^/(privacy/?$|terms/?$|shipping/?$|blog(/|$)|order/|assets/|sitemap\.xml$|llms\.txt$|merchant-feed\.xml$|robots\.txt$|favicon) {
        set $otrace_web http://otrace-web:80;
        proxy_pass $otrace_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Search / wishlist / any other path -> Kalles theme (never React).
    location ^~ /search { return 302 /shop; }
    location / { return 302 /; }
    location @otrace_legacy_unused {
        set $otrace_web http://otrace-web:80;
        proxy_pass $otrace_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
