# The paths otrace.co serves from the Kalles theme.
#
# NOT loaded from this repo. The live front end is the shared `scalaro-nginx-1`
# container reading /opt/scalaro/nginx.conf, and nothing mounts this file - it
# is kept here so the change is in version control and reviewable, because a
# config that exists only on the server is a config nobody can diff.
#
# These blocks go INSIDE the `server { server_name otrace.co; }` block, above
# its `location / { ... otrace-web ... }`.
#
# Editing /opt/scalaro/nginx.conf: never `sed -i` it. It is a single-file bind
# mount, and in-place editing replaces the inode and silently detaches the file
# from the container. Truncate-write it (`cat new > nginx.conf`), confirm the
# inode is unchanged, check `docker exec scalaro-nginx-1 nginx -t`, then
# `nginx -s reload`.
#
# ---------------------------------------------------------------------------
# Why these paths
#
# Everything not listed here still comes from the React build, deliberately:
#   /order/success   Stripe sends customers here AFTER they pay. If this 404s,
#                    they have been charged and see an error page.
#   /sitemap.xml /robots.txt /llms.txt /merchant-feed.xml
#                    generated by the React build; moving them is its own job.
#   /sizing /contact /garment-dyed /privacy /terms /shipping
#                    real pages with real content. Several already have a theme
#                    render; they stay on the React build until that route is
#                    switched on purpose. /lookbook is the exception below.
#
# Adding a path here before the theme can serve it turns a working page into a
# 404. Rolling back is deleting these blocks and reloading; nothing else moves.
# ---------------------------------------------------------------------------

location = / {
    set $otrace_theme http://otrace-api:3000;
    proxy_pass $otrace_theme/api/theme-preview/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}

location ^~ /shop {
    set $otrace_theme http://otrace-api:3000;
    rewrite ^/shop(.*)$ /api/theme-preview/shop$1 break;
    proxy_pass $otrace_theme;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}

location ^~ /product/ {
    set $otrace_theme http://otrace-api:3000;
    rewrite ^/product/(.*)$ /api/theme-preview/product/$1 break;
    proxy_pass $otrace_theme;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}

location = /lookbook {
    set $otrace_theme http://otrace-api:3000;
    proxy_pass $otrace_theme/api/theme-preview/page/lookbook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}

location = /cart {
    set $otrace_theme http://otrace-api:3000;
    proxy_pass $otrace_theme/api/theme-preview/cart;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}
